<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Phoenix Map Viewer</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><style>html,body,#map{height:100%;margin:0;background:#09090b;color:#f2f1ee;font:13px system-ui}#bar{position:absolute;z-index:10;left:8px;top:8px;right:8px;display:flex;gap:8px}#bar input{flex:1;background:#121214;border:1px solid #2a2a30;color:#f2f1ee;border-radius:8px;padding:8px}</style></head><body><div id="bar"><input id="q" placeholder="Find place"/></div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const m=L.map('map').setView([29.7604,-95.3698],11);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(m);L.circleMarker([29.7589,-95.3677],{radius:8,color:'#fff',fillColor:'#3ecf8e',fillOpacity:1,weight:2}).addTo(m).bindPopup('PHX-HOU-01 Downtown');document.getElementById('q').addEventListener('keydown',async e=>{if(e.key!=='Enter')return;const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(e.target.value));const d=await r.json();if(d[0])m.setView([+d[0].lat,+d[0].lon],14);});</script></body></html>
